name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite (standard library only)
        run: python -m unittest discover -s tests -t . -v

  ffmpeg:
    name: end-to-end with ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run the suite including the real-footage test
        run: python -m unittest tests.test_prepare_e2e -v && python -m unittest discover -s tests -t .
      - name: Smoke-test the installed command
        run: pip install . && plantfloor report --events demo --top 3
